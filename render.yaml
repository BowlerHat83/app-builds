services:
  - type: web
    name: seo-audit-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: PAGESPEED_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
